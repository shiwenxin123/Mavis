name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extra
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Entry points
        run: |
          python -c "import marvis; assert marvis.__version__ == '2.1.2', marvis.__version__"
          marvis --help
          marvis --version
          marvis doctor
          marvis workflow templates
          marvis workflow run --template hygiene --root samples/hygiene
          marvis workflow run --template disk --root samples/disk
          marvis system repair
          marvis search . --mode name --keyword pyproject --limit 5
      - name: Pytest
        run: pytest
